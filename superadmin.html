<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard Super Admin — Smart RT</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background: #FAFAFA; color: #1E293B; }
    h1, h2, h3, .font-heading { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="min-h-screen">

  <header class="bg-white border-b border-slate-200/85 sticky top-0 z-30">
    <div class="max-w-5xl mx-auto px-6 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 rounded-lg bg-rose-700 text-white flex items-center justify-center font-heading font-bold text-sm">RW</div>
        <div>
          <span id="superName" class="font-heading font-bold text-sm text-slate-900 block leading-none">Memuat...</span>
          <span class="text-[11px] text-rose-700 font-medium uppercase tracking-wider">Super Admin / RW</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <a href="admin.html" class="text-xs font-semibold text-[#1B4332] bg-emerald-50 px-3 py-1.5 rounded-lg border border-emerald-100">Panel Admin RT</a>
        <button id="logoutBtn" class="text-xs font-medium text-slate-500 hover:text-rose-600 px-3 py-1.5 rounded-lg border border-slate-200 transition">Keluar</button>
      </div>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-6 py-8 space-y-8">
    <!-- Pengaturan Templat Surat & Kop -->
    <div class="bg-white p-6 rounded-2xl border border-slate-200/80 space-y-4">
      <h3 class="font-heading font-bold text-base text-slate-900">Pengaturan Templat Surat & Kop (Global RW/RT)</h3>
      <form id="formPengaturanSurat" class="grid grid-cols-1 sm:grid-cols-2 gap-4 text-sm">
        <div>
          <label class="text-xs text-slate-500">Kop Baris 1 (Instansi)</label>
          <input type="text" id="cfgKop1" class="w-full mt-1 px-3.5 py-2 rounded-xl border border-slate-200" />
        </div>
        <div>
          <label class="text-xs text-slate-500">Kop Baris 2 (Kecamatan/Kelurahan)</label>
          <input type="text" id="cfgKop2" class="w-full mt-1 px-3.5 py-2 rounded-xl border border-slate-200" />
        </div>
        <div>
          <label class="text-xs text-slate-500">Nama Ketua RT</label>
          <input type="text" id="cfgRt" class="w-full mt-1 px-3.5 py-2 rounded-xl border border-slate-200" />
        </div>
        <div>
          <label class="text-xs text-slate-500">Nama Ketua RW</label>
          <input type="text" id="cfgRw" class="w-full mt-1 px-3.5 py-2 rounded-xl border border-slate-200" />
        </div>
        <div class="sm:col-span-2">
          <button type="submit" class="bg-rose-700 hover:bg-rose-800 text-white text-sm font-medium px-6 py-2.5 rounded-xl transition">Simpan Perubahan Templat & Kop</button>
        </div>
      </form>
    </div>

    <!-- Manajemen Peran Pengguna -->
    <div class="bg-white rounded-2xl border border-slate-200/80 overflow-hidden">
      <div class="p-5 border-b border-slate-100">
        <h3 class="font-heading font-bold text-sm text-slate-900">Manajemen Peran Pengguna (Role Management)</h3>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm">
          <thead class="bg-slate-50 text-slate-500 text-xs uppercase">
            <tr>
              <th class="px-5 py-3">Nama Warga</th>
              <th class="px-5 py-3">Rumah & RT</th>
              <th class="px-5 py-3">Role Saat Ini</th>
              <th class="px-5 py-3">Ubah Role</th>
            </tr>
          </thead>
          <tbody id="tableUsersSuperAdmin" class="divide-y divide-slate-100"></tbody>
        </table>
      </div>
    </div>
  </main>

  <script type="module">
    import { supabase } from './js/config.js';
    import { checkAuthAndRedirect, setupLogout } from './js/app.js';

    async function initSuperAdmin() {
      const auth = await checkAuthAndRedirect('superadmin');
      if (!auth) return;
      setupLogout();

      document.getElementById('superName').textContent = auth.profile.nama_lengkap;
      loadSuperAdminData();
    }

    async function loadSuperAdminData() {
      const { data: cfg } = await supabase.from('pengaturan_surat').select('*').single();
      if (cfg) {
        document.getElementById('cfgKop1').value = cfg.kop_baris_1 || '';
        document.getElementById('cfgKop2').value = cfg.kop_baris_2 || '';
        document.getElementById('cfgRt').value = cfg.nama_ketua_rt || '';
        document.getElementById('cfgRw').value = cfg.nama_ketua_rw || '';
      }

      const { data: users } = await supabase.from('profiles').select('*').order('nama_lengkap');
      document.getElementById('tableUsersSuperAdmin').innerHTML = (users || []).map(u => `
        <tr>
          <td class="px-5 py-3.5 font-medium text-slate-900">${u.nama_lengkap}</td>
          <td class="px-5 py-3.5 text-slate-500">Rumah ${u.no_rumah} (RT ${u.rt})</td>
          <td class="px-5 py-3.5"><span class="px-2 py-0.5 rounded bg-slate-100 text-xs font-medium">${u.role}</span></td>
          <td class="px-5 py-3.5">
            <select onchange="window.ubahRole('${u.id}', this.value)" class="border border-slate-200 rounded-lg px-2 py-1 text-xs bg-white">
              <option value="warga" ${u.role === 'warga' ? 'selected' : ''}>Warga</option>
              <option value="admin" ${u.role === 'admin' ? 'selected' : ''}>Admin RT</option>
              <option value="superadmin" ${u.role === 'superadmin' ? 'selected' : ''}>Super Admin</option>
            </select>
          </td>
        </tr>
      `).join('');
    }

    document.getElementById('formPengaturanSurat').addEventListener('submit', async (e) => {
      e.preventDefault();
      await supabase.from('pengaturan_surat').update({
        kop_baris_1: document.getElementById('cfgKop1').value,
        kop_baris_2: document.getElementById('cfgKop2').value,
        nama_ketua_rt: document.getElementById('cfgRt').value,
        nama_ketua_rw: document.getElementById('cfgRw').value
      }).eq('id', 1);
      alert('Pengaturan surat berhasil diperbarui!');
    });

    window.ubahRole = async (userId, newRole) => {
      await supabase.from('profiles').update({ role: newRole }).eq('id', userId);
      loadSuperAdminData();
      alert('Role pengguna berhasil diubah!');
    };

    initSuperAdmin();
  </script>
</body>
</html>

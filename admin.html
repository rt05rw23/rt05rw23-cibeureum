<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Pengurus - RT 05 / RW 23</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">

  <!-- Form Login Pengurus -->
  <div id="login-box" class="max-w-md mx-auto pt-20 px-4">
    <div class="bg-white p-8 rounded-2xl border border-slate-200 shadow-sm">
      <h2 class="text-xl font-bold text-slate-900 mb-1">Login Pengurus RT 05</h2>
      <p class="text-xs text-slate-500 mb-6">Masuk untuk mengelola informasi & administrasi warga</p>
      <form id="form-login" class="space-y-4">
        <input type="email" id="email" required placeholder="Email Pengurus" class="w-full px-3.5 py-2.5 text-sm border border-slate-300 rounded-xl outline-none focus:ring-2 focus:ring-blue-600">
        <input type="password" id="password" required placeholder="Password" class="w-full px-3.5 py-2.5 text-sm border border-slate-300 rounded-xl outline-none focus:ring-2 focus:ring-blue-600">
        <button type="submit" class="w-full bg-blue-600 text-white font-semibold py-2.5 rounded-xl hover:bg-blue-700 transition">Masuk Dashboard</button>
      </form>
      <a href="index.html" class="block text-center text-xs text-slate-400 mt-4 hover:text-blue-600">&larr; Kembali ke Beranda Warga</a>
    </div>
  </div>

  <!-- Area Dashboard Admin -->
  <div id="dashboard-box" class="hidden max-w-4xl mx-auto py-10 px-4 space-y-8">
    <div class="flex items-center justify-between bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
      <h1 class="font-bold text-blue-700 text-sm sm:text-base">Dashboard Pengurus RT 05 / RW 23</h1>
      <button id="btn-logout" class="text-xs bg-rose-50 hover:bg-rose-100 text-rose-600 font-semibold px-3.5 py-2 rounded-lg transition">Keluar</button>
    </div>

    <div class="grid md:grid-cols-2 gap-6">
      <!-- Tambah Pengumuman -->
      <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
        <h3 class="font-bold mb-4 text-slate-900">Buat Pengumuman Baru</h3>
        <form id="form-pengumuman" class="space-y-3">
          <input type="text" id="judul" required placeholder="Judul Pengumuman" class="w-full px-3.5 py-2.5 text-sm border border-slate-300 rounded-xl outline-none focus:ring-2 focus:ring-blue-600">
          <select id="kategori" class="w-full px-3.5 py-2.5 text-sm border border-slate-300 rounded-xl bg-white outline-none">
            <option value="Kerja Bakti">Kerja Bakti</option>
            <option value="Rapat Warga">Rapat Warga</option>
            <option value="Keamanan">Keamanan</option>
            <option value="Umum">Umum</option>
          </select>
          <textarea id="isi" rows="3" required placeholder="Isi pengumuman..." class="w-full px-3.5 py-2.5 text-sm border border-slate-300 rounded-xl outline-none focus:ring-2 focus:ring-blue-600"></textarea>
          <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold py-2.5 rounded-xl transition">Terbitkan Pengumuman</button>
        </form>
      </div>

      <!-- Catat Kas RT -->
      <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
        <h3 class="font-bold mb-4 text-slate-900">Catat Transaksi Kas RT</h3>
        <form id="form-kas" class="space-y-3">
          <input type="text" id="ket_kas" required placeholder="Keterangan (Misal: Iuran Sampah)" class="w-full px-3.5 py-2.5 text-sm border border-slate-300 rounded-xl outline-none focus:ring-2 focus:ring-emerald-600">
          <select id="jenis_kas" class="w-full px-3.5 py-2.5 text-sm border border-slate-300 rounded-xl bg-white outline-none">
            <option value="Masuk">Pemasukan (+)</option>
            <option value="Keluar">Pengeluaran (-)</option>
          </select>
          <input type="number" id="nominal_kas" required placeholder="Nominal (Contoh: 150000)" class="w-full px-3.5 py-2.5 text-sm border border-slate-300 rounded-xl outline-none focus:ring-2 focus:ring-emerald-600">
          <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-semibold py-2.5 rounded-xl transition">Simpan ke Buku Kas</button>
        </form>
      </div>
    </div>
  </div>

  <script type="module">
    import { supabase } from './js/config.js';

    const loginBox = document.getElementById('login-box');
    const dashBox = document.getElementById('dashboard-box');

    // Cek sesi login
    const { data: { session } } = await supabase.auth.getSession();
    if (session) {
      loginBox.classList.add('hidden');
      dashBox.classList.remove('hidden');
    }

    // Proses Login
    document.getElementById('form-login').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      const { error } = await supabase.auth.signInWithPassword({ email, password });
      if (error) {
        alert('Login gagal: ' + error.message);
      } else {
        location.reload();
      }
    });

    // Logout
    document.getElementById('btn-logout').addEventListener('click', async () => {
      await supabase.auth.signOut();
      location.reload();
    });

    // Simpan Pengumuman
    document.getElementById('form-pengumuman').addEventListener('submit', async (e) => {
      e.preventDefault();
      const judul = document.getElementById('judul').value;
      const kategori = document.getElementById('kategori').value;
      const isi = document.getElementById('isi').value;

      const { error } = await supabase.from('pengumuman').insert([{ judul, kategori, isi }]);
      if (error) {
        alert('Gagal: ' + error.message);
      } else {
        alert('Pengumuman berhasil diterbitkan!');
        e.target.reset();
      }
    });

    // Simpan Kas
    document.getElementById('form-kas').addEventListener('submit', async (e) => {
      e.preventDefault();
      const keterangan = document.getElementById('ket_kas').value;
      const jenis = document.getElementById('jenis_kas').value;
      const nominal = document.getElementById('nominal_kas').value;

      const { error } = await supabase.from('kas_rt').insert([{ keterangan, jenis, nominal }]);
      if (error) {
        alert('Gagal: ' + error.message);
      } else {
        alert('Data kas berhasil disimpan!');
        e.target.reset();
      }
    });
  </script>
</body>
</html>

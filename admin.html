<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Ketua RT 05 RW 23 | Cibeureum</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f1f5f9; color: #1e293b; line-height: 1.5; }
    .app-container { max-width: 640px; margin: 0 auto; min-height: 100vh; background: #ffffff; box-shadow: 0 10px 25px rgba(15, 23, 42, 0.08); display: flex; flex-direction: column; }
    .hero-header { background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 55%, #2563eb 100%); color: #ffffff; padding: 24px; }
    .header-top { display: flex; justify-content: space-between; align-items: center; }
    .badge-pill { display: inline-flex; background: rgba(255, 255, 255, 0.15); border: 1px solid rgba(255, 255, 255, 0.25); color: #eff6ff; font-size: 10px; font-weight: 700; padding: 3px 10px; border-radius: 99px; text-transform: uppercase; }
    .hero-title { font-size: 18px; font-weight: 800; margin-top: 4px; }
    .btn-admin-link { background: rgba(255, 255, 255, 0.12); border: 1px solid rgba(255, 255, 255, 0.25); color: #ffffff; text-decoration: none; font-size: 11px; font-weight: 600; padding: 6px 10px; border-radius: 10px; }
    .tab-bar-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 4px; background: #ffffff; padding: 6px; border-radius: 14px; border: 1px solid #e2e8f0; margin-bottom: 16px; }
    .tab-btn { border: none; background: transparent; padding: 10px; border-radius: 10px; font-size: 12px; font-weight: 700; color: #64748b; cursor: pointer; }
    .tab-btn.active { background: #1d4ed8; color: #ffffff; }
    .main-content { padding: 20px; flex: 1; }
    .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .section-title { font-size: 15px; font-weight: 700; color: #0f172a; }
    .form-group { margin-bottom: 12px; }
    .form-label { display: block; font-size: 12px; font-weight: 600; color: #334155; margin-bottom: 4px; }
    .form-control { width: 100%; padding: 10px 12px; font-size: 13px; background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 10px; color: #0f172a; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: none; border-radius: 10px; font-weight: 700; font-size: 12px; padding: 10px 14px; cursor: pointer; text-decoration: none; }
    .btn-full { width: 100%; }
    .btn-primary { background: #1d4ed8; color: #ffffff; }
    .btn-success { background: #059669; color: #ffffff; }
    .btn-danger { background: #fee2e2; color: #dc2626; }
    .btn-light { background: #f1f5f9; color: #334155; border: 1px solid #e2e8f0; }
    .btn-test { background: #eff6ff; color: #1d4ed8; border: 1px solid #bfdbfe; font-size: 11px; padding: 5px 8px; border-radius: 8px; }
    .card { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 14px; padding: 14px; margin-bottom: 10px; box-shadow: 0 2px 4px rgba(15, 23, 42, 0.02); }
    .card-pending { background: #eff6ff; border-color: #bfdbfe; }
    .badge { font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 99px; }
    .badge-acc { background: #dbeafe; color: #1e40af; }
    .badge-wait { background: #fef3c7; color: #92400e; }
    .saldo-box { background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 100%); color: #ffffff; padding: 16px; border-radius: 16px; margin-bottom: 16px; }
    .saldo-amount { font-size: 22px; font-weight: 800; margin: 2px 0; }
    .kas-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 10px; margin-bottom: 6px; }
    .text-plus { color: #1d4ed8; font-weight: 700; font-size: 12px; }
    .text-minus { color: #dc2626; font-weight: 700; font-size: 12px; }
    .hidden { display: none !important; }
    .flex-between { display: flex; justify-content: space-between; align-items: center; }
    .flex-gap { display: flex; gap: 6px; flex-wrap: wrap; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  </style>
</head>
<body>

  <div id="loginBox" style="max-width:360px; margin:50px auto; padding:0 16px;">
    <div class="card" style="padding:24px; text-align:center; border-radius:20px;">
      <div style="width:48px; height:48px; background:#eff6ff; color:#1d4ed8; border-radius:14px; display:flex; align-items:center; justify-content:center; margin:0 auto 12px auto; font-size:22px;">🔐</div>
      <h1 style="font-size:16px; font-weight:800; color:#0f172a;">Panel Ketua RT 05</h1>
      <p style="font-size:11px; color:#64748b; margin:4px 0 16px 0;">Masukkan PIN Pengurus RT 05 RW 23</p>
      
      <input type="password" id="inputPin" maxlength="6" placeholder="••••••" class="form-control" style="text-align:center; font-size:20px; font-weight:800; letter-spacing:6px; margin-bottom:10px;">
      <button onclick="cekPin()" class="btn btn-primary btn-full">Masuk Dashboard</button>

      <div class="flex-between" style="margin-top:14px; padding-top:12px; border-top:1px solid #f1f5f9; font-size:11px;">
        <a href="index.html" style="color:#64748b; text-decoration:none; font-weight:600;">&larr; Portal Warga</a>
        <button onclick="document.getElementById('inputPin').value='052305'" style="background:none; border:none; color:#1d4ed8; font-weight:700; cursor:pointer;">Isi PIN Demo (052305)</button>
      </div>
    </div>
  </div>

  <div id="dashboard" class="app-container hidden">
    <header class="hero-header">
      <div class="header-top">
        <div>
          <span class="badge-pill">Otoritas Pengurus</span>
          <h1 class="hero-title">Dashboard RT 05 RW 23</h1>
        </div>
        <div class="flex-gap">
          <a href="index.html" class="btn-admin-link">Portal Warga</a>
          <button onclick="logout()" class="btn-admin-link" style="background:rgba(225,29,72,0.25); border-color:rgba(255,255,255,0.2); cursor:pointer;">Keluar</button>
        </div>
      </div>
    </header>

    <main class="main-content">
      <div class="tab-bar-2">
        <button onclick="switchAdminTab('surat')" id="atab-surat" class="tab-btn active">Verifikasi Surat</button>
        <button onclick="switchAdminTab('kas')" id="atab-kas" class="tab-btn">Kelola Kas RT</button>
      </div>

      <div id="aview-surat">
        <div class="section-header">
          <h2 class="section-title">Permohonan Masuk</h2>
          <button onclick="loadSemuaSurat()" class="btn btn-test">↻ Muat Ulang</button>
        </div>
        <div id="listSuratAdmin"></div>
      </div>

      <div id="aview-kas" class="hidden">
        <div class="saldo-box">
          <p style="font-size:11px; color:#bfdbfe;">Saldo Bersih Kas RT 05</p>
          <div id="adminSaldo" class="saldo-amount">Rp 0</div>
          <div class="grid-2" style="margin-top:10px; padding-top:8px; border-top:1px solid rgba(255,255,255,0.2); font-size:11px;">
            <div><span style="color:#bfdbfe;">Pemasukan:</span> <strong id="totalMasuk" style="color:#6ee7b7;">Rp 0</strong></div>
            <div><span style="color:#bfdbfe;">Pengeluaran:</span> <strong id="totalKeluar" style="color:#fda4af;">Rp 0</strong></div>
          </div>
        </div>

        <form id="formKas" class="card" style="background:#f8fafc;">
          <h3 style="font-size:11px; text-transform:uppercase; color:#334155; margin-bottom:10px;">Catat Transaksi Kas</h3>
          <div class="grid-2">
            <div class="form-group">
              <label class="form-label">Tanggal</label>
              <input type="date" id="kasTanggal" class="form-control" required>
            </div>
            <div class="form-group">
              <label class="form-label">Jenis</label>
              <select id="kasJenis" class="form-control">
                <option value="Masuk">Pemasukan (+)</option>
                <option value="Keluar">Pengeluaran (-)</option>
              </select>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">Keterangan</label>
            <input type="text" id="kasKet" class="form-control" required placeholder="Contoh: Iuran Warga / Beli ATK">
          </div>
          <div class="form-group">
            <label class="form-label">Nominal (Rp)</label>
            <input type="number" id="kasNominal" class="form-control" required placeholder="100000">
          </div>
          <button type="submit" class="btn btn-primary btn-full">+ Simpan ke Buku Kas</button>
        </form>

        <h3 style="font-size:11px; color:#64748b; text-transform:uppercase; margin:14px 0 8px 0;">Riwayat Transaksi</h3>
        <div id="listKasAdmin"></div>
      </div>
    </main>
  </div>

  <script>
    const SUPABASE_URL = 'https://cvdrewujvyxsmpbnswtw.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_bdWg4K4V29MNj5SLtVlImA_1cpcogD1';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const PIN_ADMIN = '052305';

    if (sessionStorage.getItem('rt05_auth') === 'true') {
      tampilkanDashboard();
    }

    function cekPin() {
      const pin = document.getElementById('inputPin').value;
      if (pin === PIN_ADMIN) {
        sessionStorage.setItem('rt05_auth', 'true');
        tampilkanDashboard();
      } else {
        alert('PIN Keamanan Salah!');
      }
    }

    function logout() {
      sessionStorage.removeItem('rt05_auth');
      location.reload();
    }

    function tampilkanDashboard() {
      document.getElementById('loginBox').classList.add('hidden');
      document.getElementById('dashboard').classList.remove('hidden');
      document.getElementById('kasTanggal').valueAsDate = new Date();
      loadSemuaSurat();
      loadKasAdmin();
    }

    function switchAdminTab(tab) {
      ['surat', 'kas'].forEach(t => {
        document.getElementById(`aview-${t}`).classList.add('hidden');
        document.getElementById(`atab-${t}`).classList.remove('active');
      });
      document.getElementById(`aview-${tab}`).classList.remove('hidden');
      document.getElementById(`atab-${tab}`).classList.add('active');
    }

    async function loadSemuaSurat() {
      const { data, error } = await supabaseClient
        .from('pengajuan_surat')
        .select('*')
        .order('created_at', { ascending: false });

      const wadah = document.getElementById('listSuratAdmin');
      if (error || !data || !data.length) {
        wadah.innerHTML = '<div class="card" style="text-align:center; font-size:12px; color:#94a3b8;">Belum ada permohonan surat masuk.</div>';
        return;
      }

      wadah.innerHTML = data.map(item => {
        const isAcc = item.status === 'Disetujui';
        const basePath = window.location.href.substring(0, window.location.href.lastIndexOf('/'));
        const linkSurat = `${basePath}/surat.html?id=${item.id}`;
        const pesanWa = `Halo Bpk/Ibu *${item.nama_lengkap}*, permohonan *${item.keperluan}* (No: ${item.nomor_surat}) telah *DISETUJUI* oleh Ketua RT 05 RW 23 Cibeureum.\n\nSilakan buka tautan berikut untuk mencetak dokumen mandiri dari rumah:\n${linkSurat}\n\nTerima kasih.`;
        const linkWa = `https://wa.me/?text=${encodeURIComponent(pesanWa)}`;

        return `
          <div class="card ${isAcc ? '' : 'card-pending'}">
            <div class="flex-between" style="align-items:flex-start;">
              <div>
                <span style="font-size:11px; color:#1d4ed8; font-weight:700;">${item.nomor_surat}</span>
                <h4 style="font-size:14px; font-weight:800; color:#0f172a; margin:2px 0;">${item.nama_lengkap}</h4>
                <p style="font-size:11px; color:#64748b;">NIK: ${item.nik} • ${item.tempat_tgl_lahir}</p>
              </div>
              <span class="badge ${isAcc ? 'badge-acc' : 'badge-wait'}">${item.status}</span>
            </div>
            <div style="font-size:11px; margin-top:8px; background:#f8fafc; border:1px solid #e2e8f0; padding:8px; border-radius:8px;">
              <p><strong>Keperluan:</strong> ${item.keperluan}</p>
              <p style="margin-top:2px;"><strong>Alamat:</strong> ${item.alamat}</p>
            </div>
            <div class="flex-gap" style="justify-content:flex-end; margin-top:10px;">
              ${!isAcc ? `<button onclick="setujuiSurat('${item.id}')" class="btn btn-primary btn-sm">✓ Setujui (ACC)</button>` : ''}
              ${isAcc ? `<a href="${linkWa}" target="_blank" class="btn btn-success btn-sm">💬 Kirim WA</a>` : ''}
              <a href="surat.html?id=${item.id}" target="_blank" class="btn btn-light btn-sm">Pratinjau</a>
              <button onclick="hapusSurat('${item.id}')" class="btn btn-danger btn-sm">Hapus</button>
            </div>
          </div>
        `;
      }).join('');
    }

    async function setujuiSurat(id) {
      await supabaseClient.from('pengajuan_surat').update({ status: 'Disetujui' }).eq('id', id);
      loadSemuaSurat();
    }

    async function hapusSurat(id) {
      if (!confirm('Hapus permanen permohonan ini?')) return;
      await supabaseClient.from('pengajuan_surat').delete().eq('id', id);
      loadSemuaSurat();
    }

    document.getElementById('formKas').addEventListener('submit', async (e) => {
      e.preventDefault();
      const payload = {
        tanggal: document.getElementById('kasTanggal').value,
        jenis: document.getElementById('kasJenis').value,
        keterangan: document.getElementById('kasKet').value.trim(),
        nominal: Number(document.getElementById('kasNominal').value)
      };

      const { error } = await supabaseClient.from('kas_rt').insert([payload]);
      if (error) {
        alert('Gagal menyimpan kas: ' + error.message);
        return;
      }

      document.getElementById('kasKet').value = '';
      document.getElementById('kasNominal').value = '';
      loadKasAdmin();
    });

    async function loadKasAdmin() {
      const { data, error } = await supabaseClient
        .from('kas_rt')
        .select('*')
        .order('tanggal', { ascending: false });

      if (error || !data) return;

      let masuk = 0, keluar = 0;
      data.forEach(d => {
        if (d.jenis === 'Masuk') masuk += Number(d.nominal);
        else keluar += Number(d.nominal);
      });

      document.getElementById('totalMasuk').innerText = 'Rp ' + masuk.toLocaleString('id-ID');
      document.getElementById('totalKeluar').innerText = 'Rp ' + keluar.toLocaleString('id-ID');
      document.getElementById('adminSaldo').innerText = 'Rp ' + (masuk - keluar).toLocaleString('id-ID');

      document.getElementById('listKasAdmin').innerHTML = data.map(item => `
        <div class="kas-item" style="background:#fff;">
          <div>
            <div style="font-size:12px; font-weight:600;">${item.keterangan}</div>
            <div style="font-size:10px; color:#94a3b8;">${item.tanggal}</div>
          </div>
          <div style="display:flex; align-items:center; gap:8px;">
            <span class="${item.jenis === 'Masuk' ? 'text-plus' : 'text-minus'}">
              ${item.jenis === 'Masuk' ? '+' : '-'} Rp ${Number(item.nominal).toLocaleString('id-ID')}
            </span>
            <button onclick="hapusKas('${item.id}')" style="border:none; background:none; color:#94a3b8; font-weight:bold; cursor:pointer;">✕</button>
          </div>
        </div>
      `).join('');
    }

    async function hapusKas(id) {
      if (!confirm('Hapus catatan transaksi ini?')) return;
      await supabaseClient.from('kas_rt').delete().eq('id', id);
      loadKasAdmin();
    }
  </script>
</body>
</html>

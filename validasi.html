<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Validasi Keaslian Surat - RT 05 / RW 23 Kel. Cibeureum</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

  <div class="max-w-md w-full bg-white rounded-3xl shadow-sm border border-slate-200 overflow-hidden">
    
    <!-- Header Instansi -->
    <div class="bg-blue-600 text-white p-6 text-center">
      <div class="w-12 h-12 rounded-2xl bg-white/20 backdrop-blur-sm flex items-center justify-center font-bold text-lg mx-auto mb-3">
        05
      </div>
      <h1 class="font-bold text-base tracking-wide">SISTEM VALIDASI DOKUMEN DIGITAL</h1>
      <p class="text-xs text-blue-100 mt-0.5">RT 05 / RW 23 Kelurahan Cibeureum, Kota Cimahi</p>
    </div>

    <!-- Konten Hasil Verifikasi -->
    <div id="hasil-box" class="p-6 sm:p-8">
      <p class="text-center text-sm text-slate-400 py-8">Memverifikasi keaslian dokumen...</p>
    </div>

    <div class="bg-slate-50 px-6 py-4 border-t border-slate-100 text-center">
      <a href="index.html" class="text-xs font-semibold text-blue-600 hover:underline">
        Kunjungi Portal Resmi RT 05 / RW 23 &rarr;
      </a>
    </div>

  </div>

  <script type="module">
    import { supabase } from './js/config.js';

    const params = new URLSearchParams(window.location.search);
    const id = params.get('id');
    const box = document.getElementById('hasil-box');

    async function verifikasi() {
      if (!id) {
        tampilkanTidakValid('Parameter dokumen tidak ditemukan.');
        return;
      }

      const { data, error } = await supabase
        .from('pengajuan_surat')
        .select('*')
        .eq('id', id)
        .single();

      const { data: tpl } = await supabase
        .from('pengaturan_surat')
        .select('nama_rt')
        .eq('id', 'default')
        .single();

      if (error || !data) {
        tampilkanTidakValid('Dokumen tidak terdaftar dalam sistem administrasi RT 05 / RW 23.');
        return;
      }

      if (!data.teregister || !data.nomor_surat) {
        tampilkanTidakValid('Dokumen ini tercatat dalam pengajuan, namun BELUM DISAHKAN / DITANDATANGANI oleh pengurus RT.');
        return;
      }

      // Format Tanggal & Jam Ditandatangani
      const tglObj = new Date(data.tgl_ttd);
      const tglFormat = tglObj.toLocaleDateString('id-ID', {
        weekday: 'long',
        day: 'numeric',
        month: 'long',
        year: 'numeric'
      });
      const jamFormat = tglObj.toLocaleTimeString('id-ID', {
        hour: '2-digit',
        minute: '2-digit'
      });

      const penandatangan = (tpl && tpl.nama_rt && !tpl.nama_rt.includes('...')) 
        ? tpl.nama_rt 
        : 'Ketua RT 05 / RW 23 Kel. Cibeureum';

      box.innerHTML = `
        <div class="text-center mb-6">
          <div class="w-14 h-14 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-3">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path>
            </svg>
          </div>
          <span class="inline-block bg-emerald-50 text-emerald-700 border border-emerald-200 text-xs font-bold px-3 py-1 rounded-full">
            DOKUMEN ASLI & TEREGISTER
          </span>
          <p class="text-xs text-slate-500 mt-2">Surat pengantar ini sah dan tercatat pada buku register digital RT 05 / RW 23.</p>
        </div>

        <div class="bg-slate-50 rounded-2xl p-4 border border-slate-200/80 space-y-3 text-sm">
          <div>
            <span class="text-[11px] font-semibold text-slate-400 uppercase block">Nama Pemohon</span>
            <span class="font-bold text-slate-900 uppercase">${data.nama_pemohon}</span>
          </div>
          <div class="border-t border-slate-200/70 pt-2.5">
            <span class="text-[11px] font-semibold text-slate-400 uppercase block">Nomor Surat</span>
            <span class="font-mono font-semibold text-blue-700">${data.nomor_surat}</span>
          </div>
          <div class="border-t border-slate-200/70 pt-2.5">
            <span class="text-[11px] font-semibold text-slate-400 uppercase block">Jenis Surat / Keperluan</span>
            <span class="font-medium text-slate-800">${data.jenis_surat}</span>
          </div>
          <div class="border-t border-slate-200/70 pt-2.5">
            <span class="text-[11px] font-semibold text-slate-400 uppercase block">Ditandatangani Pada</span>
            <span class="font-semibold text-slate-900">${tglFormat}, Pukul ${jamFormat} WIB</span>
          </div>
          <div class="border-t border-slate-200/70 pt-2.5">
            <span class="text-[11px] font-semibold text-slate-400 uppercase block">Pejabat Penandatangan</span>
            <span class="font-medium text-slate-800">${penandatangan}</span>
          </div>
        </div>
      `;
    }

    function tampilkanTidakValid(pesan) {
      box.innerHTML = `
        <div class="text-center py-4">
          <div class="w-14 h-14 bg-rose-100 text-rose-600 rounded-full flex items-center justify-center mx-auto mb-3 font-bold text-2xl">
            !
          </div>
          <span class="inline-block bg-rose-50 text-rose-700 border border-rose-200 text-xs font-bold px-3 py-1 rounded-full">
            DOKUMEN TIDAK VALID
          </span>
          <p class="text-sm text-slate-600 mt-3 leading-relaxed">${pesan}</p>
        </div>
      `;
    }

    verifikasi();
  </script>
</body>
</html>

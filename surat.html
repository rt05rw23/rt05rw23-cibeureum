<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cetak Dokumen Resmi | RT 05 RW 23 Cibeureum</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #e2e8f0; padding: 20px 12px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .toolbar { max-width: 720px; margin: 0 auto 16px auto; background: #ffffff; padding: 12px 16px; border-radius: 16px; box-shadow: 0 4px 12px rgba(15, 23, 42, 0.08); display: flex; justify-content: space-between; align-items: center; }
    .btn { border: none; border-radius: 10px; font-weight: 700; font-size: 12px; padding: 10px 16px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
    .btn-back { background: #f1f5f9; color: #334155; }
    .btn-print { background: #1d4ed8; color: #ffffff; }
    .hidden { display: none !important; }
    .kertas-a4 { max-width: 720px; margin: 0 auto; background: #ffffff; padding: 40px 44px; box-shadow: 0 10px 25px rgba(15, 23, 42, 0.1); color: #000000; font-family: "Times New Roman", Times, serif; line-height: 1.5; }
    .kop-surat { text-align: center; border-bottom: 3px double #000000; padding-bottom: 10px; margin-bottom: 22px; }
    .kop-surat p { font-size: 13px; font-weight: bold; text-transform: uppercase; letter-spacing: 0.5px; }
    .kop-surat h1 { font-size: 17px; font-weight: bold; text-transform: uppercase; margin: 2px 0; }
    .kop-surat .alamat-kop { font-size: 11px; font-style: italic; font-weight: normal; text-transform: none; }
    .judul-surat { text-align: center; margin-bottom: 22px; }
    .judul-surat h2 { font-size: 15px; font-weight: bold; text-decoration: underline; text-transform: uppercase; }
    .judul-surat p { font-size: 13px; margin-top: 2px; }
    .paragraf { font-size: 14px; text-align: justify; text-indent: 32px; margin-bottom: 14px; }
    .tabel-data { width: 100%; font-size: 14px; margin-bottom: 16px; border-collapse: collapse; }
    .tabel-data td { padding: 4px 0; vertical-align: top; }
    .tabel-data td:first-child { width: 170px; }
    .tabel-data td:nth-child(2) { width: 16px; }
    .ttd-area { display: flex; justify-content: space-between; align-items: flex-end; margin-top: 36px; font-size: 14px; }
    .qr-box { border: 1px solid #cbd5e1; padding: 6px; display: inline-block; background: #fff; }
    .qr-note { font-family: sans-serif; font-size: 10px; color: #475569; margin-top: 4px; line-height: 1.3; }
    .ttd-kanan { text-align: center; min-width: 200px; }
    @media print {
      .no-print { display: none !important; }
      body { background: #ffffff !important; padding: 0 !important; }
      .kertas-a4 { box-shadow: none !important; max-width: 100% !important; padding: 1cm !important; }
    }
  </style>
</head>
<body>

  <div class="toolbar no-print">
    <a href="index.html" class="btn btn-back">&larr; Kembali ke Portal</a>
    <button id="btnPrint" onclick="window.print()" class="btn btn-print hidden">🖨️ Cetak / Simpan PDF</button>
  </div>

  <div id="dokumen" class="kertas-a4">
    <p style="text-align:center; font-family:sans-serif; font-size:13px; color:#64748b; padding:40px 0;">Memverifikasi keabsahan dokumen...</p>
  </div>

  <script>
    const SUPABASE_URL = 'https://cvdrewujvyxsmpbnswtw.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_bdWg4K4V29MNj5SLtVlImA_1cpcogD1';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function loadSurat() {
      const params = new URLSearchParams(window.location.search);
      const id = params.get('id');
      if (!id) {
        document.getElementById('dokumen').innerHTML = '<p style="text-align:center; font-family:sans-serif; color:#dc2626;">ID Dokumen tidak valid.</p>';
        return;
      }

      const { data, error } = await supabaseClient.from('pengajuan_surat').select('*').eq('id', id).single();

      if (error || !data) {
        document.getElementById('dokumen').innerHTML = '<p style="text-align:center; font-family:sans-serif; color:#dc2626;">Dokumen tidak ditemukan dalam database.</p>';
        return;
      }

      if (data.status !== 'Disetujui') {
        document.getElementById('dokumen').innerHTML = `
          <div style="text-align:center; font-family:sans-serif; padding:40px 16px;">
            <div style="font-size:40px; margin-bottom:10px;">⏳</div>
            <h2 style="font-size:18px; color:#0f172a; margin-bottom:8px;">Dokumen Menunggu Persetujuan</h2>
            <p style="font-size:13px; color:#64748b; margin-bottom:20px;">
              Surat nomor <b>${data.nomor_surat}</b> atas nama <b>${data.nama_lengkap}</b> belum di-ACC oleh Ketua RT 05 RW 23.
            </p>
            <a href="admin.html" class="btn btn-print">Buka Panel Admin untuk ACC &rarr;</a>
          </div>
        `;
        return;
      }

      document.getElementById('btnPrint').classList.remove('hidden');
      const tanggalSurat = new Date(data.created_at).toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });

      document.getElementById('dokumen').innerHTML = `
        <div class="kop-surat">
          <p>Pemerintah Kota Cimahi</p>
          <p>Kecamatan Cimahi Selatan • Kelurahan Cibeureum</p>
          <h1>Rukun Tetangga 05 Rukun Warga 23</h1>
          <p class="alamat-kop">Sekretariat: Kp. Cibeureum RT 05 RW 23, Kelurahan Cibeureum, Kota Cimahi 40535</p>
        </div>

        <div class="judul-surat">
          <h2>SURAT PENGANTAR</h2>
          <p>Nomor: ${data.nomor_surat}</p>
        </div>

        <p class="paragraf">
          Yang bertanda tangan di bawah ini Ketua RT 05 RW 23 Kelurahan Cibeureum Kecamatan Cimahi Selatan Kota Cimahi, dengan ini menerangkan bahwa:
        </p>

        <table class="tabel-data">
          <tr><td>Nama Lengkap</td><td>:</td><td style="font-weight:bold; text-transform:uppercase;">${data.nama_lengkap}</td></tr>
          <tr><td>NIK</td><td>:</td><td>${data.nik}</td></tr>
          <tr><td>Tempat, Tanggal Lahir</td><td>:</td><td>${data.tempat_tgl_lahir}</td></tr>
          <tr><td>Alamat</td><td>:</td><td>${data.alamat}</td></tr>
          <tr><td>Keperluan</td><td>:</td><td style="font-weight:bold;">${data.keperluan}</td></tr>
        </table>

        <p class="paragraf">
          Orang tersebut di atas adalah benar warga kami yang berdomisili di lingkungan RT 05 RW 23 Kelurahan Cibeureum. Demikian surat pengantar ini dibuat dengan sebenarnya untuk dapat dipergunakan sebagaimana mestinya.
        </p>

        <div class="ttd-area">
          <div>
            <div class="qr-box"><div id="qrcode"></div></div>
            <p class="qr-note">Dokumen sah & diterbitkan secara elektronik.<br>Pindai QR untuk verifikasi keaslian.</p>
          </div>
          <div class="ttd-kanan">
            <p>Cimahi, ${tanggalSurat}</p>
            <p style="font-weight:bold; margin-bottom:64px;">Ketua RT 05 RW 23</p>
            <p style="font-weight:bold; text-decoration:underline; text-transform:uppercase;">( Nama Ketua RT 05 )</p>
          </div>
        </div>
      `;

      if (typeof QRCode !== 'undefined') {
        new QRCode(document.getElementById("qrcode"), { text: window.location.href, width: 74, height: 74 });
      }
    }

    loadSurat();
  </script>
</body>
</html>
